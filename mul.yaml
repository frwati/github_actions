name: Multiple shells commands
on:
  push:
    branches:
      - "main"
  pull_request:
    types: [closed, assigned, opened, reopened]

jobs:
  run-shell-command:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Install dependencies
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flake8

      # Run Python commands
      - name: python commands
        run: |
          import platform
          print(platform.processor())
        shell: python

      # Run flake8 to lint Python files
      - name: Run Flake8
        run: flake8 .
        shell: bash

  run-windows-command:
    runs-on: windows-latest
    needs: ["run-shell-command"]
    steps:
      # Current directory with PowerShell
      - name: Current directory with PowerShell
        run: Get-Location

      # Current directory with Bash
      - name: Current directory with Bash
        run: pwd
        shell: bash

      # Print some default environment variables
      - name: Print environment variables
        run: |
          echo "HOME: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTION: ${GITHUB_ACTION}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
        shell: bash

